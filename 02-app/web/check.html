<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B846A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EyeG-Stack" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EyeG-Stack Check</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/eyeg.css" />
</head>
<body class="theme-check auth-pending">
  <div class="eyeg-app check-app">
    <!-- ヘッダー（Push 画面と同じ構造） -->
    <header class="eyeg-header">
      <div>
        <h1 class="eyeg-title">EyeG-Stack<span class="app-version">v0.1.10</span></h1>
        <p class="eyeg-subtitle">Check</p>
      </div>
      <div class="header-actions">
        <button class="menu-back menu-back--icon reload-btn" type="button"
                aria-label="再読み込み" title="再読み込み（キャッシュを無視）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <a class="menu-back menu-back--icon" href="index.html"
           aria-label="EyeG-Stack メニューへ戻る" title="EyeG-Stack メニューへ戻る">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </a>
        <a class="menu-back menu-back--icon menu-back--primary" href="push.html" aria-label="Push へ（メモを追加）" title="Push へ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </a>
        <button class="eyeg-avatar" type="button" aria-label="ログアウト" title="ログアウト">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ソートタブ -->
    <div class="sort-tabs" role="tablist" aria-label="並び替え">
      <button class="sort-tab" role="tab" data-sort="recommended" aria-selected="true">フロート</button>
      <button class="sort-tab" role="tab" data-sort="newest" aria-selected="false">新しい順</button>
      <button class="sort-tab" role="tab" data-sort="category" aria-selected="false">カテゴリ</button>
    </div>

    <!-- メモ一覧 -->
    <main class="eyeg-main">
      <input type="search" id="filter-input" class="eyeg-input check-filter"
             placeholder="絞り込み…" autocomplete="off" aria-label="メモを絞り込み" />
      <p class="list-hint" id="list-hint">カードをタップで詳細・長押しで並べ替え</p>
      <div class="memo-list" id="memo-list" role="list"></div>
    </main>
  </div>

  <!-- 右下フローティング Push ボタン -->
  <a class="fab" href="push.html" aria-label="Push（メモを追加）" title="Push">＋</a>

  <script src="assets/app.js"></script>
  <script src="assets/check.js"></script>
</body>
</html>
