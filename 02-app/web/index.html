<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="theme-color" content="#434E56" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EyeG-Stack" />

  <title>EyeG-Stack</title>
  <link rel="manifest" href="manifest.json" />

<body class="theme-neutral">

    <main class="eyeg-main menu-main">

      <a class="menu-card" href="check.html">
