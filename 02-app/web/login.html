<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#434E56" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EyeG-Stack" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EyeG-Stack Login</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/eyeg.css" />
</head>
<body class="theme-neutral">
  <div class="eyeg-app">
    <header class="eyeg-header">
      <div>
        <h1 class="eyeg-title">EyeG-Stack<span class="app-version">v0.1.7</span></h1>
        <p class="eyeg-subtitle">Login</p>
      </div>
      <div class="header-actions">
        <button class="menu-back menu-back--icon reload-btn" type="button"
                aria-label="再読み込み" title="再読み込み（キャッシュを無視）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="eyeg-main login-main">
      <!-- ステップ1: メールアドレス入力 → コード送信 -->
      <form id="email-form" class="eyeg-actions" autocomplete="email">
        <p class="login-lead">
          メールアドレスを入力すると、ログイン用の6桁コードをお送りします。<br />
          初めての方もこのままアカウントが作成されます。
        </p>
        <div class="eyeg-field">
          <label class="eyeg-label" for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            class="eyeg-input"
            placeholder="you@example.com"
            required
            autofocus
            inputmode="email"
          />
        </div>
        <button type="submit" class="eyeg-button eyeg-button--primary" id="send-btn">
          コードを送る
        </button>
      </form>

      <!-- ステップ2: コード入力 → 検証（初期は非表示） -->
      <form id="code-form" class="eyeg-actions" hidden>
        <p class="login-lead">
          <span id="code-sent-to"></span> に送ったコードを入力してください。<br />
          有効期限は10分です。
        </p>
        <div class="eyeg-field">
          <label class="eyeg-label" for="code">6桁コード</label>
          <input
            type="text"
            id="code"
            class="eyeg-input login-code-input"
            placeholder="000000"
            required
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="\d{6}"
          />
        </div>
        <button type="submit" class="eyeg-button eyeg-button--primary" id="verify-btn">
          ログイン
        </button>
        <button type="button" class="eyeg-button eyeg-button--ghost" id="back-btn">
          メールアドレスを変更
        </button>
      </form>

      <p class="login-note" id="login-note"></p>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const emailForm = document.getElementById('email-form');
    const codeForm = document.getElementById('code-form');
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const sendBtn = document.getElementById('send-btn');
    const verifyBtn = document.getElementById('verify-btn');
    const backBtn = document.getElementById('back-btn');
    const sentTo = document.getElementById('code-sent-to');
    const note = document.getElementById('login-note');

    // ログイン済みならメニューへ
    fetch('/api/auth/me', { credentials: 'same-origin' }).then((res) => {
      if (res.ok) window.location.href = 'index.html';
    });

    // 数字以外の入力を弾く（ペースト時も含めて数字6桁に整形）
    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    });

    // ステップ1: コード送信
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      note.textContent = '送信中…';
      try {
        await api('/api/auth/request-code', {
          method: 'POST',
          body: { email: emailInput.value },
        });
        note.textContent = '';
        sentTo.textContent = emailInput.value.trim();
        emailForm.hidden = true;
        codeForm.hidden = false;
        codeInput.focus();
      } catch (err) {
        note.textContent = err.message;
      } finally {
        sendBtn.disabled = false;
      }
    });

    // ステップ2: コード検証 → 成功でメニューへ
    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      verifyBtn.disabled = true;
      note.textContent = '確認中…';
      try {
        await api('/api/auth/verify-code', {
          method: 'POST',
          body: { email: emailInput.value, code: codeInput.value },
        });
        window.location.href = 'index.html';
      } catch (err) {
        note.textContent = err.message;
        verifyBtn.disabled = false;
      }
    });

    // メールアドレス変更（ステップ1へ戻る）
    backBtn.addEventListener('click', () => {
      codeForm.hidden = true;
      emailForm.hidden = false;
      codeInput.value = '';
      note.textContent = '';
      emailInput.focus();
    });
  </script>
</body>
</html>
