<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B4D84" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EyeG-Stack" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EyeG-Stack Push</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/eyeg.css" />
</head>
<body class="theme-push auth-pending">
  <div class="eyeg-app push-app">
    <!-- ヘッダー -->
    <header class="eyeg-header">
      <div>
        <h1 class="eyeg-title">EyeG-Stack<span class="app-version">v0.1.10</span></h1>
        <p class="eyeg-subtitle" id="screen-subtitle">Push</p>
      </div>
      <div class="header-actions">
        <button class="menu-back menu-back--icon reload-btn" type="button"
                aria-label="再読み込み" title="再読み込み（キャッシュを無視）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <a class="menu-back menu-back--icon" href="index.html"
           aria-label="EyeG-Stack メニューへ戻る" title="EyeG-Stack メニューへ戻る">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </a>
        <a class="menu-back menu-back--icon menu-back--primary" href="check.html" aria-label="Check へ（メモ一覧）" title="Check へ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"/>
            <circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"/>
            <circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <button class="eyeg-avatar" type="button" aria-label="ログアウト" title="ログアウト">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- メイン入力エリア -->
    <main class="eyeg-main push-main">
      <div class="eyeg-field">
        <textarea id="memo-body" class="eyeg-textarea" rows="3" placeholder="メモを入力…" autofocus></textarea>
      </div>

      <div class="eyeg-field">
        <span class="eyeg-label">カテゴリ</span>
        <div class="cat-toggle" role="group" aria-label="カテゴリ">
          <!-- 並び順は Check のカテゴリ表示（一般 → 仕事用 → 私用）と揃える -->
          <button type="button" class="cat-toggle__btn" data-cat="general" aria-pressed="false">一般</button>
          <button type="button" class="cat-toggle__btn" data-cat="work" aria-pressed="false">仕事用</button>
          <button type="button" class="cat-toggle__btn" data-cat="personal" aria-pressed="true">私用</button>
        </div>
      </div>

      <button type="button" class="eyeg-button eyeg-button--ghost detail-toggle" id="detail-toggle"
              aria-expanded="false" aria-controls="detail-panel">+ 詳細</button>

      <div class="detail-panel" id="detail-panel" hidden>
        <div class="eyeg-field">
          <span class="eyeg-label">重要度</span>
          <div class="importance" role="group" aria-label="重要度">
            <button type="button" class="importance__star" data-value="1" aria-pressed="false" aria-label="重要度 1">★</button>
            <button type="button" class="importance__star" data-value="2" aria-pressed="false" aria-label="重要度 2">★</button>
            <button type="button" class="importance__star" data-value="3" aria-pressed="false" aria-label="重要度 3">★</button>
            <button type="button" class="importance__star" data-value="4" aria-pressed="false" aria-label="重要度 4">★</button>
            <button type="button" class="importance__star" data-value="5" aria-pressed="false" aria-label="重要度 5">★</button>
          </div>
        </div>

        <div class="eyeg-field">
          <label class="eyeg-label" for="due-date">期限</label>
          <input type="date" id="due-date" class="eyeg-input eyeg-input--datetime" />
        </div>

        <div class="eyeg-field">
          <span class="eyeg-label">写真（最大4枚）</span>
          <div class="photo-grid" id="photo-grid">
            <button type="button" class="photo-slot" data-slot="0" aria-label="写真を追加">＋</button>
            <button type="button" class="photo-slot" data-slot="1" aria-label="写真を追加">＋</button>
            <button type="button" class="photo-slot" data-slot="2" aria-label="写真を追加">＋</button>
            <button type="button" class="photo-slot" data-slot="3" aria-label="写真を追加">＋</button>
          </div>
          <input type="file" id="photo-input" accept="image/*" hidden />
        </div>
      </div>

      <div class="gps-status" id="gps-status">
        <span class="gps-status__dot"></span>
        <span id="gps-text">GPS取得中…</span>
      </div>
    </main>

    <!-- 下部固定アクション（編集モードでは削除アイコンが左に出る） -->
    <div class="eyeg-actions push-actions">
      <button type="button" class="icon-btn icon-btn--danger" id="delete-btn" aria-label="削除" title="削除" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <button type="button" class="eyeg-button eyeg-button--primary" id="push-btn">Push</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script src="assets/push.js"></script>
</body>
</html>
